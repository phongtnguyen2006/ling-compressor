[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcomp"
version = "0.1.0"
description = "Local, deterministic, non-generative linguistic prompt compressor"
requires-python = ">=3.12"
dependencies = [
    "tiktoken>=0.7",
    "pyyaml>=6",
    "spacy>=3.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
llmlingua = ["llmlingua>=0.2", "torch>=2"]
lexical = ["numpy>=1.26", "nltk>=3.8.1"]
semantic-eval = ["sentence-transformers>=3.0", "scipy>=1.11"]
dev = ["pytest>=8", "hypothesis>=6", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptcomp = ["data/*.yaml", "data/*.txt", "data/*.LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
